[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quick-processing-tool"
version = "0.2.0"
description = "Lightweight Windows image preparation tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.3",
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
quick-processing-tool = "quick_processing_tool.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
